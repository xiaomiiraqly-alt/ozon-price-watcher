[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-price-watcher"
version = "0.4.1"
description = "Private family Telegram bot with isolated Ozon accounts and independent price tracking"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp-socks>=0.9,<1",
    "aiohttp>=3.11,<4",
    "mcp>=1.30,<2",
    # Security floors for MCP/aiohttp transitive dependencies.
    "PyJWT>=2.15,<3",
    "multidict>=6.9.1,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

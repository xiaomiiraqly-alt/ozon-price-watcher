[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-price-watcher"
version = "0.4.0"
description = "Private family Telegram bot with isolated Ozon accounts and independent price tracking"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp-socks>=0.9,<1",
    "aiohttp>=3.11,<4",
    "mcp>=1.10,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: bash -n install.sh scripts/*.sh deploy/gateway-entrypoint.sh
      - name: Validate optional HTTPS Compose configuration
        env:
          GATEWAY_TOKEN: ci-only-placeholder-not-a-real-secret-1234567890
          TELEGRAM_USER_ID: '111'
        run: |
          cp .env.example .env
          docker compose config --quiet
          LOGIN_DOMAIN=ozon.example.org docker compose --profile family-https config --quiet

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/prepare.sh
      - run: docker build -t ozon-watcher-ci .
      - run: docker build -f Dockerfile.gateway -t ozon-gateway-ci .

  browser-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_login.py
